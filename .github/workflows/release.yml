name: DA Cartographer CI and Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
            artifact: cartographer-macos-arm64

          - name: macOS x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact: cartographer-macos-x86_64

          - name: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: cartographer-windows-x86_64

          - name: Windows arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: cartographer-windows-arm64

          - name: Linux x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: cartographer-linux-x86_64

          - name: Linux arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: cartographer-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgl1-mesa-dev

      - name: Test
        run: cargo test --workspace --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pkg_dir="${{ matrix.artifact }}-package"
          version=0.0.0
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          packaging/macos.sh "target/${{ matrix.target }}/release/cartographer" "$pkg_dir" "${version%%[-+]*}"
          tar -C "$pkg_dir" -czf "${{ matrix.artifact }}.tar.gz" "DA Cartographer.app"

      - name: Package (Linux)
        if: contains(matrix.target, 'linux')
        shell: bash
        run: |
          pkg_dir="${{ matrix.artifact }}-package"
          mkdir -p "$pkg_dir"
          cp "target/${{ matrix.target }}/release/cartographer" "$pkg_dir/"
          cp maps.ron packaging/install-desktop.sh cartographer/icons/LICENSE-Tabler.txt "$pkg_dir/"
          cp cartographer/app-icon.png "$pkg_dir/cartographer.png"
          tar -C "$pkg_dir" -czf "${{ matrix.artifact }}.tar.gz" cartographer maps.ron install-desktop.sh cartographer.png LICENSE-Tabler.txt

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "${{ matrix.artifact }}-package"
          $binary = "target/${{ matrix.target }}/release/cartographer.exe"
          $resources = llvm-readobj --coff-resources $binary
          if ($LASTEXITCODE -ne 0 -or -not ($resources -match 'GROUP_ICON')) {
            throw "Missing DA Cartographer icon resource in $binary"
          }
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item $binary, maps.ron, cartographer/icons/LICENSE-Tabler.txt -Destination $package
          Compress-Archive -Path "$package/*" -DestinationPath "${{ matrix.artifact }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  release:
    name: Publish Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DA Cartographer ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            *.tar.gz
            *.zip
